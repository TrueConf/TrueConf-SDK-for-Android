apply plugin: 'com.android.application'

repositories {
    maven {
        credentials {
            username project.findProperty("trueconfUsername") ?: ""
            password project.findProperty("trueconfPassword") ?: ""
        }
        url 'https://sdk.trueconf.com/maven/repository/maven-public/'
    }
}

android {
    compileSdk 36

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    defaultConfig {
        applicationId "com.trueconf.sample.TestApp5"
        minSdk 24
        targetSdk 36
    }

    buildFeatures {
        viewBinding = true
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
    namespace 'com.trueconf.sample'
}

dependencies {
    api 'com.trueconf:trueconfsdk:3.0.8.95@aar'
    api 'com.trueconf:media:3.0.8.95@aar'
    api 'com.trueconf:jnicore:3.0.8.95@aar'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'androidx.concurrent:concurrent-futures:1.3.0'
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.leanback:leanback:1.2.0'
    implementation 'androidx.leanback:leanback-preference:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.emoji:emoji-bundled:1.2.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'org.greenrobot:eventbus:3.3.1'
}
